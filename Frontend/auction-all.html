<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriGuard - Timed Auctions (all-in-one)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #F7F4EE;
  --surface: #FFFFFF;
  --ink: #163528;
  --green: #1D9E75;
  --green-dark: #0F6E56;
  --green-light: #E1F5EE;
  --green-mid: #A7D7C5;
  --green-soft: #E1F5EE;
  --green-line: #A7D7C5;
  --blue: #2F5F8A;
  --blue-light: #E8F0FA;
  --amber: #B54708;
  --amber-light: #FFF4E5;
  --red: #B42318;
  --red-light: #FCE8E6;
  --farmer-bg: #F3E8D8;
  --farmer-ink: #8A5A2B;
  --buyer-bg: #E8F0FA;
  --buyer-ink: #2F5F8A;
  --gray-50: #FCFAF6;
  --gray-100: #F3F0E8;
  --gray-200: #E5E1D8;
  --gray-400: #9CA3AF;
  --gray-600: #6B7280;
  --gray-700: #374151;
  --gray-800: #374151;
  --gray-900: #163528;
  --white: #ffffff;
  --text: #163528;
  --text2: #374151;
  --text3: #6B7280;
  --border: #E5E1D8;
  --shadow: 0 10px 30px rgba(15, 110, 86, 0.06);
  --shadow-md: 0 10px 30px rgba(15, 110, 86, 0.06);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 14px;
  --font: "Source Sans 3", system-ui, sans-serif;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
}


* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: var(--font); background: var(--bg); color: var(--ink); }
h1, h2, .logo { font-family: var(--display); letter-spacing: -0.02em; }
.navbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: rgba(255,255,255,.94); border-bottom: 1px solid var(--border);
  padding: 12px 22px; position: sticky; top: 0; z-index: 900;
}
.logo { color: var(--green); font-weight: 700; font-size: 28px; display: inline-flex; align-items: center; gap: .4em; }
.nav-links { display: flex; flex: 1; justify-content: center; flex-wrap: wrap; gap: 4px; }
.nav-links a, .nav-links button.nav-chip {
  border-radius: 999px; font-weight: 600; text-decoration: none; color: #374151;
  padding: 8px 14px; font-size: 14px; border: none; background: none; cursor: pointer; font-family: inherit;
}
.nav-links a:hover, .nav-links button.nav-chip:hover, .nav-links a.active, .nav-links button.nav-chip.active {
  background: var(--green-light); color: var(--green);
}
.nav-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.logout-btn {
  background: transparent; color: var(--red); border: 1px solid #E8C4C0; border-radius: 999px;
  padding: 8px 14px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit;
}
.ag-icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; }
.lot-photo .ag-icon { width: 72px; height: 72px; }
.lot-hero .ag-icon { width: 140px; height: 140px; }
.lot-watch .ag-icon { width: 16px; height: 16px; }

/* GoBid-style timed auction layout, AgriGuard colour tokens */
.market-page {
  background: var(--bg);
  color: var(--ink);
}

.market-wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 30px 48px;
}

.market-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.market-header h1 {
  font-family: var(--display);
  font-size: 28px;
  color: #111827;
  display: flex;
  align-items: center;
  gap: 10px;
}

.market-header p {
  color: var(--gray-600);
  margin-top: 4px;
  font-size: 14px;
}

.market-tabs {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--border);
  margin-bottom: 16px;
}

.market-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  padding: 10px 18px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  color: var(--gray-600);
  cursor: pointer;
}

.market-tab:hover {
  color: var(--green);
}

.market-tab.active {
  color: var(--green-dark);
  border-bottom-color: var(--green);
}

.market-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.market-toolbar input,
.market-toolbar select {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  background: var(--gray-50);
  color: var(--ink);
}

.market-toolbar input {
  flex: 1 1 240px;
  min-width: 180px;
}

.market-toolbar input:focus,
.market-toolbar select:focus,
.form-input:focus,
.form-select:focus {
  outline: none;
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(29, 158, 117, 0.15);
  background: #fff;
}

.market-count {
  margin-left: auto;
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-600);
  white-space: nowrap;
}

.lot-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 18px;
}

.lot-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}

.lot-card:hover {
  transform: translateY(-3px);
  border-color: var(--green-mid);
  box-shadow: 0 14px 36px rgba(15, 110, 86, 0.12);
}

.lot-photo {
  position: relative;
  height: 168px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--green-dark);
  background:
    radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.45), transparent 50%),
    linear-gradient(160deg, #E1F5EE 0%, #A7D7C5 52%, #0F6E56 140%);
}

.lot-photo.goat {
  background:
    radial-gradient(circle at 70% 10%, rgba(255, 255, 255, 0.35), transparent 46%),
    linear-gradient(160deg, #F3E8D8 0%, #E1F5EE 55%, #1D9E75 140%);
}

.lot-photo.sheep {
  background:
    radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.5), transparent 50%),
    linear-gradient(160deg, #FCFAF6 0%, #E5E1D8 48%, #A7D7C5 140%);
}

.lot-photo .ag-icon {
  width: 72px;
  height: 72px;
}

.lot-count {
  position: absolute;
  left: 10px;
  top: 10px;
  background: rgba(22, 53, 40, 0.88);
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.02em;
  padding: 5px 9px;
  border-radius: 8px;
  font-variant-numeric: tabular-nums;
}

.lot-watch {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 50%;
  background: #fff;
  color: var(--gray-600);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(15, 110, 86, 0.14);
}

.lot-watch .ag-icon {
  width: 16px;
  height: 16px;
}

.lot-watch.active {
  color: var(--green);
  background: var(--green-light);
}

.lot-body {
  padding: 14px 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}

.lot-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.25;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  overflow-wrap: anywhere;
}

.lot-specs h2 {
  display: block;
  font-family: var(--display);
  font-size: 22px;
  padding: 16px 16px 0;
  overflow-wrap: anywhere;
}

.lot-bid-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}

.lot-bid-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--gray-600);
}

.lot-bid-value {
  font-size: 20px;
  font-weight: 800;
  color: var(--green);
}

.lot-expires {
  font-size: 12px;
  color: var(--red);
  font-weight: 700;
}

.lot-meta {
  font-size: 12px;
  color: var(--gray-600);
}

.lot-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: auto;
}

.lot-tag {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--green-light);
  color: var(--green-dark);
}

.lot-tag.hot {
  background: var(--amber-light);
  color: var(--amber);
}

.lot-tag.mine {
  background: var(--blue-light);
  color: var(--blue);
}

.lot-page {
  display: none;
}

.lot-page.show {
  display: block;
}

.lot-back {
  background: none;
  border: none;
  color: var(--green-dark);
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  margin-bottom: 16px;
  padding: 0;
}

.lot-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(260px, 340px);
  gap: 22px;
  align-items: start;
}

.lot-hero.lot-photo {
  height: 320px;
  border-radius: 16px;
}

.lot-hero .ag-icon {
  width: 140px;
  height: 140px;
}

.lot-hero .lot-count {
  font-size: 16px;
  padding: 8px 12px;
}

.lot-specs {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  margin-top: 16px;
  overflow: hidden;
}

.bid-box h2 {
  font-size: 16px;
  padding: 14px 16px 0;
}

.lot-specs table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

.lot-specs th,
.lot-specs td {
  padding: 10px 16px;
  text-align: left;
  font-size: 14px;
  border-top: 1px solid var(--border);
}

.lot-specs th {
  width: 38%;
  color: var(--gray-600);
  font-weight: 600;
  background: var(--gray-50);
}

.lot-desc {
  padding: 14px 16px 16px;
  color: var(--gray-700);
  font-size: 14px;
  line-height: 1.5;
}

.bid-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 18px;
  position: sticky;
  top: 84px;
  min-width: 0;
}

.bid-box .bid-kicker {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--gray-600);
}

.bid-box .bid-big {
  font-size: 34px;
  font-weight: 800;
  color: var(--green);
  line-height: 1.1;
  margin: 4px 0 10px;
}

.bid-expire {
  background: var(--red-light);
  color: var(--red);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 14px;
}

.bid-increments {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 8px 0 12px;
}

.bid-increments button {
  flex: 1 1 30%;
  min-width: 0;
  border: 1px solid var(--border);
  background: var(--gray-50);
  border-radius: 8px;
  padding: 8px 0;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  color: var(--ink);
}

.bid-increments button:hover {
  border-color: var(--green);
  background: var(--green-light);
  color: var(--green-dark);
}

.form-group {
  margin-bottom: 12px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
}

.form-input,
.form-select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
}

.btn-primary,
.btn-bid {
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  width: 100%;
}

.btn-primary:hover,
.btn-bid:hover {
  background: var(--green-dark);
}

.btn-header {
  width: auto;
  padding: 10px 18px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-secondary {
  background: transparent;
  color: var(--gray-700);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 10px 16px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}

.create-form {
  display: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 18px;
  margin-bottom: 16px;
}

.create-form.show {
  display: block;
}

.create-form .card-title {
  font-weight: 800;
  margin-bottom: 12px;
}

.form-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.bid-history {
  margin-top: 14px;
}

.bid-history h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--gray-600);
  margin-bottom: 8px;
}

.bid-history-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px;
  background: var(--gray-50);
  margin-bottom: 6px;
}

.bid-history-row.top {
  background: var(--green-light);
  font-weight: 700;
}

.alert {
  padding: 10px 12px;
  border-radius: 8px;
  margin: 10px 0;
  font-size: 13px;
}

.alert-danger {
  background: var(--red-light);
  color: var(--red);
}

.alert-success {
  background: var(--green-light);
  color: var(--green-dark);
}

.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--gray-600);
  grid-column: 1 / -1;
}

.toast {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: var(--green);
  color: white;
  padding: 14px 24px;
  border-radius: 10px;
  display: none;
  z-index: 1000;
  font-weight: 600;
  box-shadow: var(--shadow);
}

.toast.error {
  background: var(--red);
}

@media (max-width: 1100px) {
  .lot-layout,
  .form-row {
    grid-template-columns: 1fr;
  }
  .bid-box {
    position: static;
  }
  .market-wrap {
    padding: 16px;
  }
  .lot-hero.lot-photo {
    height: 220px;
  }
}

  </style>
</head>
<body class="market-page">
<div class="navbar">
  <div class="logo"><svg class="ag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> AgriGuard</div>
  <div class="nav-links">
    <button class="nav-chip active" id="chipFarmer" type="button">Farmer auctions</button>
    <button class="nav-chip" id="chipBuyer" type="button">Buyer auctions</button>
  </div>
  <div class="nav-actions">
    <button type="button" class="logout-btn" onclick="alert('This standalone file has no login. Use Farmer / Buyer above.')">Preview</button>
  </div>
</div>

<div class="market-wrap">
  <div id="catalogView">
    <div class="market-header">
      <div>
        <h1>Timed Auctions</h1>
        <p id="roleSub">List livestock from your herd. Same AgriGuard colours as the rest of the app.</p>
      </div>
      <button class="btn-primary btn-header" id="createBtn" onclick="toggleCreateForm()">Create listing</button>
    </div>

    <div class="create-form" id="createForm">
      <div class="card-title">Create New Auction Listing</div>
      <div id="createMsg"></div>
      <div class="form-row">
        <div class="form-group">
          <label>Animal</label>
          <select id="cAnimal" class="form-select"></select>
        </div>
        <div class="form-group">
          <label>Starting price (R)</label>
          <input type="number" id="cPrice" class="form-input" placeholder="min R500" min="500">
        </div>
        <div class="form-group">
          <label>Duration</label>
          <select id="cDuration" class="form-select">
            <option value="1">1 day</option>
            <option value="3" selected>3 days</option>
            <option value="5">5 days</option>
            <option value="7">7 days</option>
          </select>
        </div>
        <div class="form-group">
          <label>Yard / province</label>
          <select id="cLocation" class="form-select">
            <option>Free State</option>
            <option>Mpumalanga</option>
            <option>KwaZulu-Natal</option>
            <option>Eastern Cape</option>
            <option>Western Cape</option>
            <option>Northern Cape</option>
            <option>Limpopo</option>
            <option>Gauteng</option>
            <option>North West</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="cDesc" class="form-input" placeholder="Brief description">
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn-primary btn-header" onclick="createListing()">Publish lot</button>
        <button class="btn-secondary" onclick="toggleCreateForm()">Cancel</button>
      </div>
    </div>

    <div class="market-tabs" id="marketTabs"></div>

    <div class="market-toolbar">
      <input type="text" id="searchInput" placeholder="Search lots..." oninput="renderCatalog()">
      <select id="speciesFilter" onchange="renderCatalog()">
        <option value="">All species</option>
        <option value="Cattle">Cattle</option>
        <option value="Goat">Goat</option>
        <option value="Sheep">Sheep</option>
      </select>
      <select id="sortBy" onchange="renderCatalog()">
        <option value="date">Order by closing</option>
        <option value="price-asc">Price low to high</option>
        <option value="price-desc">Price high to low</option>
      </select>
      <div class="market-count" id="resultCount">0 Results found</div>
    </div>

    <div class="lot-grid" id="lotGrid"></div>
  </div>

  <div class="lot-page" id="lotView"></div>
</div>

<div id="toast" class="toast"></div>

<script>
/**
 * Frontend-only auction marketplace store.
 * Listings, bids, and watchlists persist in localStorage until the backend is wired up.
 */
(function (global) {
  const STORE_KEY = 'agriguard_auction_store';
  const STORE_VERSION = 2;
  const MIN_START_PRICE = 500;
  const MIN_INCREMENT = 100;
  const ANTI_SNIPE_MS = 5 * 60 * 1000;

  const SPECIES_ICONS = {
    Cattle: '<svg class="ag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="11" r="5"/><path d="M5 8l2 2M19 8l-2 2M8 18v2M16 18v2M9 7C7 5 5 5 4 6M15 7c2-2 4-2 5-1"/></svg>',
    Goat: '<svg class="ag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14c-2.5 0-4-1.5-4-3.5S10 7 12 7s4 1.5 4 3.5S14.5 14 12 14z"/><path d="M8 8L5 4M16 8l3-4M10 18v2M14 18v2"/></svg>',
    Sheep: '<svg class="ag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><circle cx="7" cy="11" r="2"/><circle cx="17" cy="11" r="2"/><circle cx="9" cy="16" r="2"/><circle cx="15" cy="16" r="2"/><path d="M10 8V6M14 8V6"/></svg>',
  };

  function nowIso() {
    return new Date().toISOString();
  }

  function daysFromNow(days) {
    return new Date(Date.now() + days * 24 * 60 * 60 * 1000).toISOString();
  }

  function hoursFromNow(hours) {
    return new Date(Date.now() + hours * 60 * 60 * 1000).toISOString();
  }

  function currentUser() {
    try {
      const raw = localStorage.getItem('agriguard_user');
      return raw ? JSON.parse(raw) : null;
    } catch (_) {
      return null;
    }
  }

  function userKey() {
    const user = currentUser();
    if (!user) return 'guest';
    return String(user.user_id || user.id || user.email || 'guest');
  }

  function userName() {
    const user = currentUser();
    if (!user) return 'You';
    return user.first_name || user.full_name || user.email || 'You';
  }

  function userRole() {
    const user = currentUser();
    const role = (user && user.role) || localStorage.getItem('agriguard_role') || '';

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) {
        const seeded = seedState();
        save(seeded);
        return seeded;
      }
      const data = JSON.parse(raw);
      if (!data || data.version !== STORE_VERSION || !Array.isArray(data.auctions)) {
        const seeded = seedState();
        save(seeded);
        return seeded;
      }
      data.animals = data.animals || [];
      data.auctions = data.auctions || [];
      data.bids = data.bids || [];
      data.watch = data.watch || {};
      return data;
    } catch (_) {
      const seeded = seedState();
      save(seeded);
      return seeded;
    }
  }

  function save(data) {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }

  function withState(mutator) {
    const state = load();
    const result = mutator(state);
    save(state);
    return result;
  }

  function isEnded(auction) {
    if (!auction) return true;
    if (auction.status === 'ended') return true;
    return new Date(auction.auction_end).getTime() <= Date.now();
  }

  function decorateAuction(auction) {
    const ended = isEnded(auction);
    return Object.assign({}, auction, {
      listing_id: auction.auction_id,
      end_time: auction.auction_end,
      status: ended ? 'ended' : 'active',
      mine: String(auction.seller_key) === userKey(),
    });
  }

  function listAuctions(filters) {
    const opts = filters || {};
    const search = String(opts.search || '').toLowerCase();
    const species = opts.species || '';
    const status = opts.status || 'active';

    return load().auctions
      .map(decorateAuction)
      .filter((auction) => {
        if (status === 'active' && auction.status !== 'active') return false;
        if (status === 'ended' && auction.status !== 'ended') return false;
        if (species && auction.species !== species) return false;
        if (search) {
          const hay = `${auction.title} ${auction.breed} ${auction.species} ${auction.description || ''}`.toLowerCase();
          if (!hay.includes(search)) return false;
        }
        return true;
      })
      .sort((a, b) => new Date(a.auction_end) - new Date(b.auction_end));
  }

  function getAuction(auctionId) {
    const id = Number(auctionId);
    const found = load().auctions.find((auction) => Number(auction.auction_id) === id);
    return found ? decorateAuction(found) : null;
  }

  function getAnimals() {
    const listed = new Set(
      load().auctions
        .filter((auction) => !isEnded(auction))
        .map((auction) => String(auction.animal_id))
    );
    return load().animals.map((animal) => Object.assign({}, animal, {
      listed: listed.has(String(animal.animal_id)),
    }));
  }

  function getBids(auctionId) {
    const id = Number(auctionId);
    return load().bids
      .filter((bid) => Number(bid.auction_id) === id)
      .sort((a, b) => b.amount - a.amount || new Date(b.time) - new Date(a.time))
      .map((bid) => Object.assign({}, bid, {
        listing_id: bid.auction_id,
        buyer: bid.buyer_name,
      }));
  }

  function minBidFor(auction) {
    const current = Number(auction.current_bid || auction.starting_price || 0);
    if (!auction.bid_count) {
      return Math.max(current, MIN_START_PRICE);
    }
    return current + MIN_INCREMENT;
  }

  function createListing(input) {
    const animalId = input && input.animal_id;
    const price = Number(input && input.starting_price);
    const durationDays = Number((input && input.duration_days) || 3);
    const description = (input && input.description) || '';

    if (!animalId) return { ok: false, error: 'Select an animal' };
    if (!price || price < MIN_START_PRICE) {
      return { ok: false, error: `Set a starting price of at least R${MIN_START_PRICE}` };
    }

    return withState((state) => {
      const animal = state.animals.find((item) => String(item.animal_id) === String(animalId));
      if (!animal) return { ok: false, error: 'Animal not found' };

      const alreadyListed = state.auctions.some(
        (auction) => String(auction.animal_id) === String(animalId) && !isEnded(auction)
      );
      if (alreadyListed) {
        return { ok: false, error: `${animal.name} is already listed in an active auction` };
      }

      const age = Math.max(0, Math.floor((Date.now() - new Date(animal.birth_date).getTime()) / (365.25 * 24 * 3600 * 1000)));
      const year = new Date(animal.birth_date).getFullYear();
      const auctionId = state.nextAuctionId++;
      const auction = {
        auction_id: auctionId,
        animal_id: animal.animal_id,
        title: `${year} ${String(animal.breed).toUpperCase()} ${String(animal.species).toUpperCase()} — ${age} YRS`,
        species: animal.species,
        breed: animal.breed,
        starting_price: price,
        current_bid: price,
        bid_count: 0,
        auction_end: daysFromNow(durationDays),
        predicted_price: Math.round(price * 1.2),
        status: 'active',
        description,
        seller_key: userKey(),
        seller_name: userName(),
        yard: (input && input.yard) || `${userName()} Yard`,
        location: (input && input.location) || 'South Africa',
        lot_no: 'AG-' + String(2400 + auctionId),
        created_at: nowIso(),
      };
      state.auctions.unshift(auction);
      return { ok: true, auction: decorateAuction(auction) };
    });
  }

  function placeBid(auctionId, amount) {
    const bidAmount = Number(amount);
    if (!bidAmount || bidAmount <= 0) {
      return { ok: false, error: 'Enter a valid bid amount' };
    }

    return withState((state) => {
      const auction = state.auctions.find((item) => Number(item.auction_id) === Number(auctionId));
      if (!auction) return { ok: false, error: 'Auction not found' };
      if (isEnded(auction)) return { ok: false, error: 'This auction has ended' };
      if (String(auction.seller_key) === userKey()) {
        return { ok: false, error: 'You cannot bid on your own listing' };
      }

      const minimum = minBidFor(decorateAuction(auction));
      if (bidAmount < minimum) {
        return { ok: false, error: `Minimum bid is R${minimum.toLocaleString()}` };
      }

      let extended = false;
      const remaining = new Date(auction.auction_end).getTime() - Date.now();
      if (remaining > 0 && remaining < ANTI_SNIPE_MS) {
        auction.auction_end = new Date(new Date(auction.auction_end).getTime() + ANTI_SNIPE_MS).toISOString();
        extended = true;
      }

      const bid = {
        bid_id: state.nextBidId++,
        auction_id: auction.auction_id,
        buyer_key: userKey(),
        buyer_name: userName(),
        amount: bidAmount,
        time: nowIso(),
      };
      state.bids.push(bid);
      auction.current_bid = bidAmount;
      auction.bid_count = (auction.bid_count || 0) + 1;

      return { ok: true, extended, bid, auction: decorateAuction(auction) };
    });
  }

  function bidStatusForAuction(auction, userMaxBid) {
    const ended = isEnded(auction);
    const winning = userMaxBid >= Number(auction.current_bid || 0);
    if (!ended && winning) return 'active';
    if (!ended && !winning) return 'outbid';
    if (ended && winning) return 'won';
    return 'lost';
  }

  function myBids() {
    const key = userKey();
    const state = load();
    const mine = state.bids.filter((bid) => bid.buyer_key === key);
    const byAuction = {};
    mine.forEach((bid) => {
      const id = Number(bid.auction_id);
      if (!byAuction[id] || bid.amount > byAuction[id].amount) {
        byAuction[id] = bid;
      }
    });

    return Object.values(byAuction)
      .map((bid) => {
        const auction = state.auctions.find((item) => Number(item.auction_id) === Number(bid.auction_id));
        if (!auction) return null;
        const decorated = decorateAuction(auction);
        return {
          id: bid.bid_id,
          auction_id: decorated.auction_id,
          auction_title: decorated.title,
          species: decorated.species,
          amount: bid.amount,
          bid_date: bid.time.slice(0, 10),
          bid_time: bid.time,
          status: bidStatusForAuction(decorated, bid.amount),
          current_bid: decorated.current_bid,
          auction_end: decorated.auction_end,
        };
      })
      .filter(Boolean)
      .sort((a, b) => new Date(b.bid_time) - new Date(a.bid_time));
  }

  function endingSoon(limit) {
    return listAuctions({ status: 'active' }).slice(0, limit || 5);
  }

  function watchlist() {
    const state = load();
    const entries = state.watch[userKey()] || [];
    return entries
      .map((entry) => {
        const auction = state.auctions.find((item) => Number(item.auction_id) === Number(entry.auction_id));
        if (!auction) return null;
        const decorated = decorateAuction(auction);
        return Object.assign({}, decorated, {
          id: decorated.auction_id,
          added_date: (entry.added_date || '').slice(0, 10),
        });
      })
      .filter(Boolean);
  }

  function isWatched(auctionId) {
    const entries = load().watch[userKey()] || [];
    return entries.some((entry) => Number(entry.auction_id) === Number(auctionId));
  }

  function toggleWatch(auctionId) {
    return withState((state) => {
      const id = Number(auctionId);
      const auction = state.auctions.find((item) => Number(item.auction_id) === id);
      if (!auction) return { ok: false, error: 'Auction not found', watched: false };

      const key = userKey();
      const entries = state.watch[key] || [];
      const index = entries.findIndex((entry) => Number(entry.auction_id) === id);
      if (index >= 0) {
        entries.splice(index, 1);
        state.watch[key] = entries;
        return { ok: true, watched: false };
      }
      entries.push({ auction_id: id, added_date: nowIso() });
      state.watch[key] = entries;
      return { ok: true, watched: true };
    });
  }

  function removeWatch(auctionId) {
    return withState((state) => {
      const key = userKey();
      state.watch[key] = (state.watch[key] || []).filter(
        (entry) => Number(entry.auction_id) !== Number(auctionId)
      );
      return { ok: true };
    });
  }

  function clearWatch() {
    return withState((state) => {
      state.watch[userKey()] = [];
      return { ok: true };
    });
  }

  function stats() {
    const active = listAuctions({ status: 'active' });
    const bids = myBids();
    const watch = watchlist();
    const won = bids.filter((bid) => bid.status === 'won');
    return {
      activeAuctions: active.length,
      myActiveBids: bids.filter((bid) => bid.status === 'active').length,
      watchCount: watch.length,
      totalBids: bids.length,
      winningBids: won.length,
      lostBids: bids.filter((bid) => bid.status === 'lost' || bid.status === 'outbid').length,
      totalSpent: won.reduce((sum, bid) => sum + Number(bid.amount || 0), 0),
    };
  }

  function formatTimeLeft(endTime) {
    const diff = new Date(endTime).getTime() - Date.now();
    if (diff <= 0 || !endTime) return 'Ended';
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    if (days > 0) return `${days}d ${hours}h`;
    if (hours > 0) return `${hours}h ${minutes}m`;
    return `${minutes}m`;
  }

  function formatCountdown(endTime) {
    const diff = new Date(endTime).getTime() - Date.now();
    if (diff <= 0 || !endTime) return '0d 0h 0m 0s';
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    return `${days}d ${hours}h ${minutes}m ${seconds}s`;
  }

  function formatExpires(endTime) {
    const date = new Date(endTime);
    if (Number.isNaN(date.getTime())) return '';
    return date.toLocaleString('en-GB', {
      weekday: 'short',
      day: 'numeric',
      month: 'short',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
    });
  }

  function formatMoney(amount) {
    return 'R' + Number(amount || 0).toLocaleString('en-ZA');
  }

  function bidLabel(auction) {
    return Number(auction && auction.bid_count) > 0 ? 'Current Bid' : 'Starting Bid';
  }

  function lotTags(auction) {
    const tags = [];
    if (auction.species) tags.push(auction.species);
    if (auction.breed) tags.push(auction.breed);
    if (Number(auction.bid_count) >= 3) tags.push('Hot Interest');
    if (!auction.bid_count) tags.push('Opening');
    if (auction.mine) tags.push('Your listing');
    return tags;
  }

  function speciesIcon(species) {
    return SPECIES_ICONS[species] || '<svg class="ag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>';
  }

  global.AgriAuction = {
    MIN_START_PRICE,
    MIN_INCREMENT,
    currentUser,
    userKey,
    userName,
    userRole,
    listAuctions,
    getAuction,
    getAnimals,
    getBids,
    minBidFor,
    createListing,
    placeBid,
    myBids,
    endingSoon,
    watchlist,
    isWatched,
    toggleWatch,
    removeWatch,
    clearWatch,
    stats,
    formatTimeLeft,
    formatCountdown,
    formatExpires,
    formatMoney,
    bidLabel,
    lotTags,
    speciesIcon,
  };
})(window);

</script>
<script>
/**
 * Shared GoBid-style catalog and lot rendering for AgriGuard auctions.
 */
(function (global) {
  function photoClass(species) {
    const key = String(species || '').toLowerCase();
    if (key === 'goat') return 'goat';
    if (key === 'sheep') return 'sheep';
    return '';
  }

  function tagHtml(auction) {
    return AgriAuction.lotTags(auction).map((tag) => {
      const extra = tag === 'Hot Interest' ? ' hot' : tag === 'Your listing' ? ' mine' : '';
      return `<span class="lot-tag${extra}">${tag}</span>`;
    }).join('');
  }

  function watchButton(auction, showWatch) {
    if (!showWatch) return '';
    const watched = AgriAuction.isWatched(auction.auction_id);
    return `
      <button class="lot-watch ${watched ? 'active' : ''}" title="${watched ? 'Remove from watchlist' : 'Watch this lot'}" onclick="AgriAuctionUI.toggleWatch(event, ${auction.auction_id})">
        <svg class="ag-icon" viewBox="0 0 24 24" fill="${watched ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3.1 6.3L22 9.3l-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2z"/></svg>
      </button>
    `;
  }

  function card(auction, options) {
    const opts = options || {};
    return `
      <article class="lot-card" onclick="AgriAuctionUI.openLot(${auction.auction_id})">
        <div class="lot-photo ${photoClass(auction.species)}">
          ${AgriAuction.speciesIcon(auction.species)}
          <div class="lot-count" data-countdown="${auction.auction_end}">${AgriAuction.formatCountdown(auction.auction_end)}</div>
          ${watchButton(auction, opts.showWatch)}
        </div>
        <div class="lot-body">
          <div class="lot-title">${auction.title}</div>
          <div>
            <div class="lot-bid-label">${AgriAuction.bidLabel(auction)}</div>
            <div class="lot-bid-value">${AgriAuction.formatMoney(auction.current_bid || auction.starting_price)}</div>
          </div>
          <div class="lot-expires">Expires ${AgriAuction.formatExpires(auction.auction_end)}</div>
          <div class="lot-meta">${auction.yard || auction.seller_name || 'AgriGuard'} · ${auction.location || 'South Africa'} · Lot ${auction.lot_no || auction.auction_id}</div>
          <div class="lot-tags">${tagHtml(auction)}</div>
        </div>
      </article>
    `;
  }

  function renderGrid(container, auctions, options) {
    if (!container) return;
    if (!auctions.length) {
      container.innerHTML = '<div class="empty-state">No lots found for this search.</div>';
      return;
    }
    container.innerHTML = auctions.map((auction) => card(auction, options)).join('');
  }

  function bidHistoryHtml(auctionId) {
    const bids = AgriAuction.getBids(auctionId);
    if (!bids.length) return '<p style="font-size:13px;color:#6b7280;">No bids yet. Be the first.</p>';
    return bids.slice(0, 8).map((bid, index) => `
      <div class="bid-history-row ${index === 0 ? 'top' : ''}">
        <span>${index === 0 ? 'Leading · ' : ''}${bid.buyer}</span>
        <span>${AgriAuction.formatMoney(bid.amount)}</span>
      </div>
    `).join('');
  }

  function lotHtml(auction, options) {
    const opts = options || {};
    const minBid = AgriAuction.minBidFor(auction);
    const ended = auction.status !== 'active';
    let action = '';
    if (ended) {
      action = '<div class="alert">This lot has expired.</div>';
    } else if (auction.mine && opts.role === 'farmer') {
      action = '<div class="alert alert-success">This is your listing. Buyers bid from the marketplace; incoming bids appear below.</div>';
    } else {
      action = `
        <div class="form-group">
          <label>Your bid (min ${AgriAuction.formatMoney(minBid)})</label>
          <input type="number" id="bidAmount" class="form-input" value="${minBid}" min="${minBid}" step="50">
        </div>
        <div class="bid-increments">
          <button type="button" onclick="AgriAuctionUI.bumpBid(100)">+ R100</button>
          <button type="button" onclick="AgriAuctionUI.bumpBid(250)">+ R250</button>
          <button type="button" onclick="AgriAuctionUI.bumpBid(500)">+ R500</button>
        </div>
        <button class="btn-bid" onclick="AgriAuctionUI.placeBid()">Place Bid</button>
      `;
    }

    return `
      <button class="lot-back" onclick="AgriAuctionUI.closeLot()">← Back to timed auctions</button>
      <div class="lot-layout">
        <div>
          <div class="lot-hero lot-photo ${photoClass(auction.species)}">
            ${AgriAuction.speciesIcon(auction.species)}
            <div class="lot-count" data-countdown="${auction.auction_end}">${AgriAuction.formatCountdown(auction.auction_end)}</div>
          </div>
          <div class="lot-specs">
            <h2>${auction.title}</h2>
            <p class="lot-desc">${auction.description || 'No additional notes for this lot.'}</p>
            <table>
              <tr><th>Lot</th><td>${auction.lot_no || auction.auction_id}</td></tr>
              <tr><th>Species</th><td>${auction.species}</td></tr>
              <tr><th>Breed</th><td>${auction.breed}</td></tr>
              <tr><th>Yard</th><td>${auction.yard || auction.seller_name || 'AgriGuard'}</td></tr>
              <tr><th>Location</th><td>${auction.location || 'South Africa'}</td></tr>
              <tr><th>Estimate</th><td>${AgriAuction.formatMoney(auction.predicted_price)}</td></tr>
            </table>
          </div>
        </div>
        <aside class="bid-box">
          <div class="bid-kicker">${AgriAuction.bidLabel(auction)}</div>
          <div class="bid-big">${AgriAuction.formatMoney(auction.current_bid || auction.starting_price)}</div>
          <div class="bid-expire">
            <span>Expires ${AgriAuction.formatExpires(auction.auction_end)}</span>
            <span data-countdown="${auction.auction_end}">${AgriAuction.formatCountdown(auction.auction_end)}</span>
          </div>
          ${action}
          <div id="bidMsg"></div>
          <div class="bid-history">
            <h3>Bid history</h3>
            ${bidHistoryHtml(auction.auction_id)}
          </div>
        </aside>
      </div>
    `;
  }

  let tickTimer = null;
  let currentLotId = null;
  let uiOptions = { role: 'buyer', showWatch: true, onChange: null };

  function tickCountdowns() {
    document.querySelectorAll('[data-countdown]').forEach((node) => {
      node.textContent = AgriAuction.formatCountdown(node.getAttribute('data-countdown'));
    });
  }

  function startTick() {
    if (tickTimer) clearInterval(tickTimer);
    tickTimer = setInterval(tickCountdowns, 1000);
  }

  function catalogEl() {
    return document.getElementById('catalogView');
  }

  function lotEl() {
    return document.getElementById('lotView');
  }

  function setUrl(id) {
    if (!window.history.replaceState) return;
    const url = new URL(window.location.href);
    if (id) url.searchParams.set('id', id);
    else url.searchParams.delete('id');
    window.history.replaceState({}, '', url);
  }

  function openLot(auctionId) {
    if (!lotEl()) {
      window.location.href = 'auctions.html?id=' + auctionId;
      return;
    }
    const auction = AgriAuction.getAuction(auctionId);
    if (!auction) return;
    currentLotId = auction.auction_id;
    const catalog = catalogEl();
    const lot = lotEl();
    if (catalog) catalog.style.display = 'none';
    if (lot) {
      lot.classList.add('show');
      lot.innerHTML = lotHtml(auction, uiOptions);
    }
    setUrl(auction.auction_id);
    window.scrollTo(0, 0);
  }

  function closeLot() {
    currentLotId = null;
    const catalog = catalogEl();
    const lot = lotEl();
    if (catalog) catalog.style.display = '';
    if (lot) {
      lot.classList.remove('show');
      lot.innerHTML = '';
    }
    setUrl(null);
    if (typeof uiOptions.onChange === 'function') uiOptions.onChange();
  }

  function bumpBid(delta) {
    const input = document.getElementById('bidAmount');
    if (!input) return;
    input.value = Number(input.value || 0) + Number(delta);
  }

  function placeBid() {
    if (currentLotId == null) return;
    const input = document.getElementById('bidAmount');
    const amount = parseFloat(input && input.value);
    const result = AgriAuction.placeBid(currentLotId, amount);
    const msg = document.getElementById('bidMsg');
    if (!result.ok) {
      if (msg) msg.innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
      if (typeof uiOptions.onToast === 'function') uiOptions.onToast(result.error, true);
      return;
    }
    if (result.extended && typeof uiOptions.onToast === 'function') {
      uiOptions.onToast('Lot extended by 5 minutes (anti-sniping)');
    }
    if (typeof uiOptions.onToast === 'function') {
      uiOptions.onToast(`Bid of ${AgriAuction.formatMoney(amount)} placed`);
    }
    openLot(currentLotId);
    if (typeof uiOptions.onChange === 'function') uiOptions.onChange();
  }

  function toggleWatch(event, auctionId) {
    if (event) event.stopPropagation();
    const result = AgriAuction.toggleWatch(auctionId);
    if (typeof uiOptions.onToast === 'function') {
      uiOptions.onToast(result.watched ? 'Added to watchlist' : 'Removed from watchlist', !result.ok);
    }
    if (typeof uiOptions.onChange === 'function') uiOptions.onChange();
  }

  function configure(options) {
    uiOptions = Object.assign(uiOptions, options || {});
    startTick();
  }

  global.AgriAuctionUI = {
    card,
    renderGrid,
    openLot,
    closeLot,
    bumpBid,
    placeBid,
    toggleWatch,
    configure,
    currentLotId: function () { return currentLotId; },
  };
})(window);

</script>
<script>
  let currentRole = 'farmer';
  let currentTab = 'timed';

  function setPreviewUser(role) {
    const isBuyer = role === 'buyer';
    const user = isBuyer
      ? { user_id: 'buyer-preview', first_name: 'Thabo', email: 'buyer@agriguard.co.za', role: 'buyer' }
      : { user_id: 'farmer-preview', first_name: 'Sipho', email: 'farmer@agriguard.co.za', role: 'farmer' };
    localStorage.setItem('agriguard_token', 'local-auction-preview');
    localStorage.setItem('agriguard_role', user.role);
    localStorage.setItem('agriguard_user', JSON.stringify(user));
  }

  function showToast(message, isError) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 5000);
  }

  function renderTabs() {
    const tabs = currentRole === 'farmer'
      ? [['timed','Timed Auctions'],['closing','Closing Soon'],['mine','My Listings']]
      : [['timed','Timed Auctions'],['closing','Closing Soon'],['watch','Watchlist']];
    document.getElementById('marketTabs').innerHTML = tabs.map(([id, label]) =>
      `<button class="market-tab ${id === currentTab ? 'active' : ''}" data-tab="${id}" onclick="setTab('${id}')">${label}</button>`
    ).join('');
  }

  function setRole(role) {
    currentRole = role;
    currentTab = 'timed';
    setPreviewUser(role);
    document.getElementById('chipFarmer').classList.toggle('active', role === 'farmer');
    document.getElementById('chipBuyer').classList.toggle('active', role === 'buyer');
    document.getElementById('createBtn').style.display = role === 'farmer' ? '' : 'none';
    document.getElementById('createForm').classList.remove('show');
    document.getElementById('roleSub').textContent = role === 'farmer'
      ? 'List livestock from your herd. Same AgriGuard colours as the rest of the app.'
      : 'Bid on livestock lots. Same AgriGuard colours — GoBid-style catalog and lot pages.';
    AgriAuctionUI.closeLot();
    AgriAuctionUI.configure({
      role: currentRole,
      showWatch: currentRole === 'buyer',
      onChange: renderCatalog,
      onToast: showToast,
    });
    renderTabs();
    renderCatalog();
  }

  function setTab(tab) {
    currentTab = tab;
    renderTabs();
    AgriAuctionUI.closeLot();
    window.scrollTo(0, 0);
    renderCatalog();
  }

  function filteredLots() {
    let lots;
    if (currentTab === 'watch') {
      lots = AgriAuction.watchlist().filter((lot) => lot.status === 'active');
    } else {
      lots = AgriAuction.listAuctions({
        search: document.getElementById('searchInput').value,
        species: document.getElementById('speciesFilter').value,
        status: 'active',
      });
      if (currentTab === 'closing') {
        lots = lots.filter((lot) => new Date(lot.auction_end) - Date.now() <= 48 * 60 * 60 * 1000);
      } else if (currentTab === 'mine') {
        lots = lots.filter((lot) => lot.mine);
      }
    }
    const search = document.getElementById('searchInput').value.toLowerCase();
    const species = document.getElementById('speciesFilter').value;
    if (currentTab === 'watch') {
      lots = lots.filter((lot) => {
        const hay = `${lot.title} ${lot.breed} ${lot.species}`.toLowerCase();
        return (!search || hay.includes(search)) && (!species || lot.species === species);
      });
    }
    const sort = document.getElementById('sortBy').value;
    if (sort === 'price-asc') lots.sort((a, b) => a.current_bid - b.current_bid);
    if (sort === 'price-desc') lots.sort((a, b) => b.current_bid - a.current_bid);
    return lots;
  }

  function renderCatalog() {
    const lots = filteredLots();
    document.getElementById('resultCount').textContent = lots.length + ' Results found';
    AgriAuctionUI.renderGrid(document.getElementById('lotGrid'), lots, { showWatch: currentRole === 'buyer' });
  }

  function toggleCreateForm() {
    const form = document.getElementById('createForm');
    form.classList.toggle('show');
    if (form.classList.contains('show')) {
      const select = document.getElementById('cAnimal');
      const animals = AgriAuction.getAnimals().filter((animal) => String(animal.animal_id).startsWith('a'));
      select.innerHTML = '<option value="">Select animal</option>' + animals.map((animal) => {
        const disabled = animal.listed ? ' disabled' : '';
        const suffix = animal.listed ? ' — already listed' : '';
        return `<option value="${animal.animal_id}"${disabled}>${animal.name} — ${animal.breed} (${animal.ear_tag_id})${suffix}</option>`;
      }).join('');
    }
  }

  function createListing() {
    const result = AgriAuction.createListing({
      animal_id: document.getElementById('cAnimal').value,
      starting_price: parseFloat(document.getElementById('cPrice').value),
      duration_days: parseInt(document.getElementById('cDuration').value, 10),
      description: document.getElementById('cDesc').value,
      location: document.getElementById('cLocation').value,
    });
    const msg = document.getElementById('createMsg');
    if (!result.ok) {
      msg.innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
      return;
    }
    document.getElementById('createForm').classList.remove('show');
    document.getElementById('cPrice').value = '';
    document.getElementById('cDesc').value = '';
    msg.innerHTML = '';
    showToast('Lot published');
    renderCatalog();
    AgriAuctionUI.openLot(result.auction.auction_id);
  }

  document.getElementById('chipFarmer').onclick = () => setRole('farmer');
  document.getElementById('chipBuyer').onclick = () => setRole('buyer');
  setRole('farmer');
</script>
</body>
</html>
