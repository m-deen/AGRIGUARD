<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AgriGuard — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/agriguard-theme.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:var(--font);color:var(--ink);min-height:100vh;
      display:grid;place-items:center;padding:32px 16px;
      background:
        radial-gradient(ellipse 80% 60% at 20% 15%, rgba(29,158,117,.55), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 80%, rgba(15,110,86,.7), transparent 50%),
        linear-gradient(160deg, #0F6E56 0%, #0a2f24 48%, #123d30 100%);
    }
    .card{
      width:100%;max-width:440px;background:rgba(255,255,255,.97);
      border:1px solid rgba(255,255,255,.65);border-radius:22px;
      padding:34px 30px;box-shadow:0 30px 60px rgba(0,0,0,.28);
      position:relative;overflow:hidden;
      animation:cardIn .55s cubic-bezier(.22,1,.36,1) both;
    }
    .card::before{
      content:"";position:absolute;left:0;right:0;top:0;height:4px;
      background:linear-gradient(90deg,#0F6E56,#1D9E75,#7BC9AE);
    }
    @keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
    .brand{text-align:center;margin-bottom:22px}
    .brand-icon{
      width:64px;height:64px;background:linear-gradient(145deg,#1D9E75,#0F6E56);border-radius:18px;
      display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;color:#fff;
      box-shadow:0 12px 28px rgba(29,158,117,.4);
    }
    h1{font-family:var(--display);font-size:30px;color:var(--green);margin-bottom:6px;letter-spacing:-.02em}
    p{font-size:14px;color:var(--gray-600);line-height:1.45}
    label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px;color:var(--ink)}
    input{
      width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;
      font-size:15px;font-family:inherit;background:#fff;color:var(--ink);
    }
    input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.15)}
    button{
      width:100%;margin-top:18px;padding:14px;border:none;border-radius:999px;
      background:linear-gradient(180deg,#22a87d,#1D9E75);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;
      box-shadow:0 10px 24px rgba(29,158,117,.35);
    }
    button:hover:not(:disabled){filter:brightness(1.03)}
    button:disabled{opacity:.6;cursor:not-allowed}
    .alert{margin-top:14px;padding:10px 12px;border-radius:12px;font-size:13px;display:none}
    .alert.ok{display:block;background:var(--green-soft);color:var(--green-dark);border:1px solid var(--green-line)}
    .alert.err{display:block;background:var(--red-light);color:var(--red);border:1px solid #E8C4C0}
    .back{display:block;text-align:center;margin-top:14px;color:var(--green);font-size:13px;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1>Reset Password</h1>
      <p>Choose a new password for your AgriGuard account.</p>
    </div>

    <label for="p1">New password</label>
    <input type="password" id="p1" placeholder="Min 8 characters" autocomplete="new-password"/>

    <label for="p2">Confirm new password</label>
    <input type="password" id="p2" placeholder="Re-enter password" autocomplete="new-password"/>

    <button id="btn" onclick="resetPassword()">Reset Password</button>
    <div id="msg" class="alert"></div>
    <a class="back" href="login.html">Back to login</a>
  </div>

<script>
const API = 'http://localhost:5000';
const token = decodeURIComponent(
  new URLSearchParams(window.location.search).get('token') || ''
).trim();

function show(msg, ok){
  const el = document.getElementById('msg');
  el.textContent = msg;
  el.className = 'alert ' + (ok ? 'ok' : 'err');
}

async function resetPassword(){
  const p1 = document.getElementById('p1').value;
  const p2 = document.getElementById('p2').value;
  const btn = document.getElementById('btn');

  if (!token) {
    show('Missing or invalid reset link. Request a new one from the login page.', false);
    return;
  }
  if (!p1 || !p2) { show('Fill both password fields.', false); return; }
  if (p1 !== p2) { show('Passwords do not match.', false); return; }
  if (p1.length < 8) { show('Password must be at least 8 characters.', false); return; }

  btn.disabled = true;
  btn.textContent = 'Resetting…';
  try {
    const r = await fetch(`${API}/api/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token,
        new_password: p1,
        confirm_password: p2
      })
    });
    const d = await r.json();
    if (d.status === 'success' || d.success) {
      show('Password reset successfully. Redirecting to login…', true);
      setTimeout(() => { window.location.href = 'login.html'; }, 1800);
    } else {
      show(d.message || 'Reset failed. Request a new link.', false);
    }
  } catch (e) {
    show('Cannot reach API. Is Flask running on :5000?', false);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
}

if (!token) {
  show('This page needs a valid reset token. Use Forgot password? on the login page.', false);
}
</script>
</body>
</html>
