<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriGuard - Timed Auctions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/agriguard-theme.css">
  <link rel="stylesheet" href="../css/auction-market.css">
</head>
<body class="market-page">
<div class="navbar">
  <div class="logo"><svg class="ag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> AgriGuard</div>
  <div class="nav-links">
    <a href="dashboard.html"><svg class="ag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Dashboard</a>
    <a href="auctions.html" class="active"><svg class="ag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 14l-4 4M14 4l6 6M4.5 16.5L9 12l7-7 3 3-7 7-4.5 4.5zM13 19h8"/></svg> Browse Auctions</a>
    <a href="bid-history.html">My Bids</a>
    <a href="watchlist.html"><svg class="ag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3.1 6.3L22 9.3l-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2z"/></svg> Watchlist</a>
  </div>
  <div class="nav-actions">
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</div>

<div class="market-wrap">
  <div id="catalogView">
    <div class="market-header">
      <div>
        <h1>Timed Auctions</h1>
        <p>Bid on livestock lots. Same AgriGuard colours — GoBid-style catalog and lot pages.</p>
      </div>
    </div>

    <div class="market-tabs">
      <button class="market-tab active" data-tab="timed" onclick="setTab('timed')">Timed Auctions</button>
      <button class="market-tab" data-tab="closing" onclick="setTab('closing')">Closing Soon</button>
      <button class="market-tab" data-tab="watch" onclick="setTab('watch')">Watchlist</button>
    </div>

    <div class="market-toolbar">
      <input type="text" id="searchInput" placeholder="Search lots..." oninput="renderCatalog()">
      <select id="speciesFilter" onchange="renderCatalog()">
        <option value="">All species</option>
        <option value="Cattle">Cattle</option>
        <option value="Goat">Goat</option>
        <option value="Sheep">Sheep</option>
      </select>
      <select id="sortBy" onchange="renderCatalog()">
        <option value="date">Order by closing</option>
        <option value="price-asc">Price low to high</option>
        <option value="price-desc">Price high to low</option>
      </select>
      <div class="market-count" id="resultCount">0 Results found</div>
    </div>

    <div class="lot-grid" id="lotGrid"></div>
  </div>

  <div class="lot-page" id="lotView"></div>
</div>

<div id="toast" class="toast"></div>

<script src="../js/auction-store.js"></script>
<script src="../js/auction-ui.js"></script>
<script>
  let currentTab = 'timed';

  function getToken() { return localStorage.getItem('agriguard_token'); }

  function logout() {
    localStorage.removeItem('agriguard_token');
    localStorage.removeItem('agriguard_user');
    localStorage.removeItem('agriguard_role');
    window.location.href = '../login.html';
  }

  function requireLogin() {
    if (!getToken()) window.location.href = '../login.html';
  }

  function showToast(message, isError) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 5000);
  }

  function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.market-tab').forEach((btn) => {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
    });
    AgriAuctionUI.closeLot();
    window.scrollTo(0, 0);
    renderCatalog();
  }

  function filteredLots() {
    let lots;
    if (currentTab === 'watch') {
      lots = AgriAuction.watchlist().filter((lot) => lot.status === 'active');
    } else {
      lots = AgriAuction.listAuctions({
        search: document.getElementById('searchInput').value,
        species: document.getElementById('speciesFilter').value,
        status: 'active',
      });
      if (currentTab === 'closing') {
        lots = lots.filter((lot) => new Date(lot.auction_end) - Date.now() <= 48 * 60 * 60 * 1000);
      }
    }
    const search = document.getElementById('searchInput').value.toLowerCase();
    const species = document.getElementById('speciesFilter').value;
    if (currentTab === 'watch') {
      lots = lots.filter((lot) => {
        const hay = `${lot.title} ${lot.breed} ${lot.species}`.toLowerCase();
        return (!search || hay.includes(search)) && (!species || lot.species === species);
      });
    }
    const sort = document.getElementById('sortBy').value;
    if (sort === 'price-asc') lots.sort((a, b) => a.current_bid - b.current_bid);
    if (sort === 'price-desc') lots.sort((a, b) => b.current_bid - a.current_bid);
    return lots;
  }

  function renderCatalog() {
    const lots = filteredLots();
    document.getElementById('resultCount').textContent = lots.length + ' Results found';
    AgriAuctionUI.renderGrid(document.getElementById('lotGrid'), lots, { showWatch: true });
  }

  requireLogin();
  AgriAuctionUI.configure({
    role: 'buyer',
    showWatch: true,
    onChange: renderCatalog,
    onToast: showToast,
  });
  renderCatalog();
  const deepLink = new URLSearchParams(window.location.search).get('id');
  if (deepLink) AgriAuctionUI.openLot(deepLink);
</script>
</body>
</html>
