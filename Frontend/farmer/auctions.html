  </div>
  <div class="nav-actions">
    <button type="button" class="logout-btn" onclick="logout()">Logout</button>
  </div>
</div>

<div class="market-wrap">
  <div id="catalogView">
    <div class="market-header">
      <div>
        <h1>Timed Auctions</h1>
        <p>List livestock from your herd. Lots use the same AgriGuard colours as the rest of the app.</p>
      </div>
      <button class="btn-primary btn-header" onclick="toggleCreateForm()">Create listing</button>
    </div>

    <div class="create-form" id="createForm">
      <div class="card-title">Create New Auction Listing</div>
      <div id="createMsg"></div>
      <div class="form-row">
        <div class="form-group">
          <label>Animal</label>
          <select id="cAnimal" class="form-select"></select>
        </div>
        <div class="form-group">
          <label>Starting price (R)</label>
          <input type="number" id="cPrice" class="form-input" placeholder="min R500" min="500">
        </div>
        <div class="form-group">
          <label>Duration</label>
          <select id="cDuration" class="form-select">
            <option value="1">1 day</option>
            <option value="3" selected>3 days</option>
            <option value="5">5 days</option>
            <option value="7">7 days</option>
          </select>
        </div>
        <div class="form-group">
          <label>Yard / province</label>
          <select id="cLocation" class="form-select">
            <option>Free State</option>
            <option>Mpumalanga</option>
            <option>KwaZulu-Natal</option>
            <option>Eastern Cape</option>
            <option>Western Cape</option>
            <option>Northern Cape</option>
            <option>Limpopo</option>
            <option>Gauteng</option>
            <option>North West</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="cDesc" class="form-input" placeholder="Brief description">
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn-primary btn-header" onclick="createListing()">Publish lot</button>
        <button class="btn-secondary" onclick="toggleCreateForm()">Cancel</button>
      </div>
    </div>

    <div class="market-tabs">
      <button class="market-tab active" data-tab="timed" onclick="setTab('timed')">Timed Auctions</button>
      <button class="market-tab" data-tab="closing" onclick="setTab('closing')">Closing Soon</button>
      <button class="market-tab" data-tab="mine" onclick="setTab('mine')">My Listings</button>
    </div>

    <div class="market-toolbar">
      <input type="text" id="searchInput" placeholder="Search lots..." oninput="renderCatalog()">
      <select id="speciesFilter" onchange="renderCatalog()">
        <option value="">All species</option>
        <option value="Cattle">Cattle</option>
        <option value="Goat">Goat</option>
        <option value="Sheep">Sheep</option>
      </select>
      <select id="sortBy" onchange="renderCatalog()">
        <option value="date">Order by closing</option>
        <option value="price-asc">Price low to high</option>
        <option value="price-desc">Price high to low</option>
      </select>
      <div class="market-count" id="resultCount">0 Results found</div>
    </div>

    <div class="lot-grid" id="lotGrid"></div>
  </div>

  <div class="lot-page" id="lotView"></div>
</div>

<div id="toast" class="toast"></div>

<script src="../js/auction-store.js"></script>
<script src="../js/auction-ui.js"></script>
<script>
  let currentTab = 'timed';

  function getToken() { return localStorage.getItem('agriguard_token'); }

  function logout() {
    localStorage.removeItem('agriguard_token');
    localStorage.removeItem('agriguard_user');
    localStorage.removeItem('agriguard_role');
    window.location.href = '../login.html';
  }

  function requireLogin() {
    if (!getToken()) window.location.href = '../login.html';
  }

  function showToast(message, isError) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 5000);
  }

  function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.market-tab').forEach((btn) => {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
    });
    renderCatalog();
  }

  function filteredLots() {
    let lots = AgriAuction.listAuctions({
      search: document.getElementById('searchInput').value,
      species: document.getElementById('speciesFilter').value,
      status: 'active',
    });
    if (currentTab === 'closing') {
      lots = lots.filter((lot) => new Date(lot.auction_end) - Date.now() <= 48 * 60 * 60 * 1000);
    } else if (currentTab === 'mine') {
      lots = lots.filter((lot) => lot.mine);
    }
    const sort = document.getElementById('sortBy').value;
    if (sort === 'price-asc') lots.sort((a, b) => a.current_bid - b.current_bid);
    if (sort === 'price-desc') lots.sort((a, b) => b.current_bid - a.current_bid);
    return lots;
  }

  function renderCatalog() {
    const lots = filteredLots();
    document.getElementById('resultCount').textContent = lots.length + ' Results found';
    AgriAuctionUI.renderGrid(document.getElementById('lotGrid'), lots, { showWatch: false });
  }

  function toggleCreateForm() {
    const form = document.getElementById('createForm');
    form.classList.toggle('show');
    if (form.classList.contains('show')) {
      const select = document.getElementById('cAnimal');
      const animals = AgriAuction.getAnimals().filter((animal) => String(animal.animal_id).startsWith('a'));
      select.innerHTML = '<option value="">Select animal</option>' + animals.map((animal) => {
        const disabled = animal.listed ? ' disabled' : '';
        const suffix = animal.listed ? ' — already listed' : '';
        return `<option value="${animal.animal_id}"${disabled}>${animal.name} — ${animal.breed} (${animal.ear_tag_id})${suffix}</option>`;
      }).join('');
    }
  }

  function createListing() {
    const result = AgriAuction.createListing({
      animal_id: document.getElementById('cAnimal').value,
      starting_price: parseFloat(document.getElementById('cPrice').value),
      duration_days: parseInt(document.getElementById('cDuration').value, 10),
      description: document.getElementById('cDesc').value,
      location: document.getElementById('cLocation').value,
    });
    const msg = document.getElementById('createMsg');
    if (!result.ok) {
      msg.innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
      return;
    }
    document.getElementById('createForm').classList.remove('show');
    document.getElementById('cPrice').value = '';
    document.getElementById('cDesc').value = '';
    msg.innerHTML = '';
    showToast('Lot published');
    renderCatalog();
    AgriAuctionUI.openLot(result.auction.auction_id);
  }

  requireLogin();
  AgriAuctionUI.configure({
    role: 'farmer',
    showWatch: false,
    onChange: renderCatalog,
    onToast: showToast,
  });
  renderCatalog();
  const deepLink = new URLSearchParams(window.location.search).get('id');
  if (deepLink) AgriAuctionUI.openLot(deepLink);
</script>
</body>
</html>
